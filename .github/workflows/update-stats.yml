name: Perbarui statistik laga

on:
  schedule:
    # Tiap jam pada menit ke-17, pukul 16.17–06.17 WIB (09–23 UTC).
    # Robot hanya menghubungi ileague.id bila ada laga Deltras dalam 3 hari terakhir
    # yang skor atau statistiknya belum tercatat; selain itu langsung selesai.
    - cron: '17 9-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ambil skor dan statistik dari ileague.id
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Dijalankan manual (Run workflow) = paksa periksa & sinkron semua jadwal ke Supabase.
        run: python3 scripts/update_stats.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Bangun ulang halaman bila data berubah
        run: |
          if git diff --quiet -- data; then
            echo "Data tidak berubah."
            exit 0
          fi
          python3 -m pip install --quiet pillow
          python3 scripts/build.py

      - name: Simpan ke GitHub
        run: |
          if git diff --quiet; then
            echo "Tidak ada yang perlu disimpan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist public
          git commit -m "Perbarui skor dan statistik laga dari ileague.id"
          git push
